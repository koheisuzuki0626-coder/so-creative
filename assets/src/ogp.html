<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#e2ebe5;
  font-family:"Inter","Zen Kaku Gothic New",sans-serif;color:#1d1d1f;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:66px 86px 60px;position:relative;overflow:hidden}
.glow{position:absolute;inset:-30% -10% auto auto;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(28,92,69,.16),rgba(28,92,69,0) 62%)}
.mark{font-size:38px;font-weight:500;letter-spacing:.01em;position:relative;
  display:flex;align-items:center;gap:.42em}
.mark .tail{font-weight:300;font-size:.84em}
.mark .w{display:flex;align-items:center}
.mark i{width:.30em;height:.075em;margin:0 .06em;border-radius:1px;background:#1c5c45}
.badge{display:inline-block;margin-top:26px;font-size:19px;letter-spacing:.14em;
  color:#14503c;border:1px solid rgba(28,92,69,.4);border-radius:980px;padding:9px 22px}
h1{font-size:98px;font-weight:300;line-height:1.16;letter-spacing:-.015em;position:relative}
h1 em{font-style:normal;color:#14503c}
.chips{display:flex;gap:14px;position:relative}
.chips li{list-style:none;font-size:21px;font-weight:400;background:#fff;white-space:nowrap;
  border:1px solid rgba(0,0,0,.1);border-radius:980px;padding:11px 22px}
.chips li::before{content:"✓";color:#14503c;margin-right:10px}
.foot{display:flex;flex-direction:column;gap:20px;align-items:flex-start;position:relative}
.url{font-size:19px;color:#6e6e73;letter-spacing:.02em;white-space:nowrap}
</style></head><body>
<div class="glow"></div>
<div>
  <div class="mark"><svg style="width:1.62em;height:1.62em;display:block;flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="so-creative">
  <title>so-creative</title>
  <!-- 五弁花。花びらを1枚ずつ描いて72度ずつ回している。塗りから輪郭を抜く
       やり方だと花びらの境目が消えて網に見えたため（2026-09-23）。
       中心は y=50。55にしていたとき、輪が枠の下へはみ出して縦長に見えた。
       小さく使うときは輪を外す（24px以下で輪と花びらがくっつく）。 -->
  <g fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="50" cy="50" r="46" stroke-width="1.4400000000000002" opacity="0.55"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(0 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(72 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(144 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(216 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(288 50 50)"/>
    <circle cx="50" cy="50" r="9"/>
  </g>
</svg><span class="w">so<i></i><span class="tail">creative</span></span></div>
  <div class="badge">AI VIDEO PRODUCTION</div>
</div>
<h1>撮影しない、<br><em>映像制作</em>。</h1>
<div class="foot">
  <ul class="chips">
    <li>社内調整がいらない</li><li>現場に出なくていい</li><li>撮り直しが発生しない</li>
  </ul>
  <div class="url">koheisuzuki0626-coder.github.io/so-creative</div>
</div>
</body></html>
