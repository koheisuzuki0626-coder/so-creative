<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{font-family:Inter,sans-serif}
.lock{display:inline-flex;align-items:center;gap:.36em;font-size:200px;font-weight:500;
  letter-spacing:.01em;line-height:1;padding:24px}
.w{display:inline-flex;align-items:center}
.w i{flex:none;width:.30em;height:.075em;margin:0 .06em;border-radius:1px;background:#1c5c45}
.w .tail{font-weight:300;font-size:.84em}
.light .w{color:#1d1d1f}
.dark{background:#16161a}
.dark .w{color:#f5f5f7}
.dark .w i{background:#79c2a1}
</style></head><body>
<!-- ロゴのSVGを直接書いてある。<img src> で読むと、SVGが viewBox しか持たない
     ためブラウザによって幅が0になったり、読み込み前に撮ってしまう。
     マークを直したら assets/logo-mark*.svg と合わせてここも更新する。 -->
<span class="lock light" id="light"><svg style="width:1.62em;height:1.62em;display:block;flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="so-creative">
  <title>so-creative</title>
  <!-- 五弁花。花びらを1枚ずつ描いて72度ずつ回している。塗りから輪郭を抜く
       やり方だと花びらの境目が消えて網に見えたため（2026-09-23）。
       中心は y=50。55にしていたとき、輪が枠の下へはみ出して縦長に見えた。
       小さく使うときは輪を外す（24px以下で輪と花びらがくっつく）。 -->
  <g fill="none" stroke="#1d1d1f" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="50" cy="50" r="46" stroke-width="1.4400000000000002" opacity="0.55"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(0 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(72 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(144 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(216 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(288 50 50)"/>
    <circle cx="50" cy="50" r="9"/>
  </g>
</svg><span class="w">so<i></i><span class="tail">creative</span></span></span>
<span class="lock dark" id="dark"><svg style="width:1.62em;height:1.62em;display:block;flex:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="so-creative">
  <title>so-creative</title>
  <!-- 五弁花。花びらを1枚ずつ描いて72度ずつ回している。塗りから輪郭を抜く
       やり方だと花びらの境目が消えて網に見えたため（2026-09-23）。
       中心は y=50。55にしていたとき、輪が枠の下へはみ出して縦長に見えた。
       小さく使うときは輪を外す（24px以下で輪と花びらがくっつく）。 -->
  <g fill="none" stroke="#f5f5f7" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="50" cy="50" r="46" stroke-width="1.4400000000000002" opacity="0.55"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(0 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(72 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(144 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(216 50 50)"/>
    <path d="M 50 52 C 26 44, 24 22, 45 12 Q 50 7, 55 12 C 76 22, 74 44, 50 52 Z" transform="rotate(288 50 50)"/>
    <circle cx="50" cy="50" r="9"/>
  </g>
</svg><span class="w">so<i></i><span class="tail">creative</span></span></span>
</body></html>
