<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 14 76 82" role="img" aria-label="so-creative">
  <title>so-creative</title>
  <!-- 五弁花。花びらを1枚ずつ描いて72度ずつ回している。塗りから輪郭を抜く
       やり方だと花びらの境目が消えて網に見えたため（2026-09-23）。
       小さく使うときは輪を外す（24px以下で輪と花びらがくっつく）。 -->
  <g fill="none" stroke="#1d1d1f" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 50 57 C 26 49, 24 27, 45 17 Q 50 12, 55 17 C 76 27, 74 49, 50 57 Z" transform="rotate(0 50 55)"/>
    <path d="M 50 57 C 26 49, 24 27, 45 17 Q 50 12, 55 17 C 76 27, 74 49, 50 57 Z" transform="rotate(72 50 55)"/>
    <path d="M 50 57 C 26 49, 24 27, 45 17 Q 50 12, 55 17 C 76 27, 74 49, 50 57 Z" transform="rotate(144 50 55)"/>
    <path d="M 50 57 C 26 49, 24 27, 45 17 Q 50 12, 55 17 C 76 27, 74 49, 50 57 Z" transform="rotate(216 50 55)"/>
    <path d="M 50 57 C 26 49, 24 27, 45 17 Q 50 12, 55 17 C 76 27, 74 49, 50 57 Z" transform="rotate(288 50 55)"/>
    <circle cx="50" cy="55" r="9"/>
  </g>
</svg>